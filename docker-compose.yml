services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      WEATHER_API_KEY: ${WEATHER_API_KEY:-}

  # Runs the test suite in a Go toolchain image: docker compose --profile test run --rm test
  test:
    image: golang:1.27-alpine
    working_dir: /src
    volumes:
      - .:/src
    command: go test -v -cover ./...
    profiles: ["test"]
